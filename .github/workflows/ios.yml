name: TestFlight (sign + upload)

# Manual trigger only — compile/test gating lives in ci-build.yml (runs on push/PR).
# Signing = App Store Connect API key + Xcode cloud-managed AUTOMATIC signing.
# No match, no certs repo, no Apple ID password. Secrets required (already set):
#   APP_STORE_CONNECT_API_KEY_ID / _ISSUER_ID / _KEY_CONTENT
on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        default: 'beta'
        type: choice
        options:
          - beta

jobs:
  deploy-to-testflight:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project (fresh, com.captainsos IDs + Team ID)
        run: xcodegen generate

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project WhisperBoard.xcodeproj -scheme WhisperBoard

      - name: Build, sign & upload to TestFlight
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: fastlane beta

      - name: Upload build logs on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-logs
          path: |
            ~/Library/Logs/gym/
            build/
          if-no-files-found: ignore
