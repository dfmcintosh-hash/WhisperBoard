name: ASC build status (diagnostic)
on:
  workflow_dispatch:
    inputs:
      fix:
        description: "set usesNonExemptEncryption=false on builds where it is unanswered"
        default: "no"

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Query App Store Connect builds
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          DO_FIX: ${{ inputs.fix }}
        run: |
          pip -q install pyjwt cryptography requests
          python3 << 'EOF'
          import jwt, time, os, requests
          token = jwt.encode(
              {"iss": os.environ["ISSUER_ID"], "iat": int(time.time()),
               "exp": int(time.time()) + 900, "aud": "appstoreconnect-v1"},
              os.environ["KEY_CONTENT"], algorithm="ES256",
              headers={"kid": os.environ["KEY_ID"]})
          h = {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}
          base = "https://api.appstoreconnect.apple.com/v1"
          app_id = requests.get(f"{base}/apps?filter[bundleId]=com.captainsos.whisperboard",
                                headers=h).json()["data"][0]["id"]
          builds = requests.get(
              f"{base}/builds?filter[app]={app_id}&sort=-uploadedDate&limit=4"
              f"&fields[builds]=version,processingState,usesNonExemptEncryption",
              headers=h).json()["data"]
          for b in builds:
              a = b["attributes"]
              print(f"build {a['version']}: {a['processingState']} "
                    f"usesNonExemptEncryption={a.get('usesNonExemptEncryption')}")
              if os.environ.get("DO_FIX") == "yes" and a.get("usesNonExemptEncryption") is None:
                  r = requests.patch(f"{base}/builds/{b['id']}", headers=h,
                                     json={"data": {"type": "builds", "id": b["id"],
                                           "attributes": {"usesNonExemptEncryption": False}}})
                  print(f"  compliance patch build {a['version']}: HTTP {r.status_code}")
          EOF
