name: WhisperBoard

settings:
  CODE_SIGN_STYLE: Automatic
  DEVELOPMENT_TEAM: "9AW36UQT73"
  SWIFT_VERSION: "5.9"

packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    from: 0.1.0

targets:

  # ─── Main App ─────────────────────────────────────────
  WhisperBoard:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: WhisperBoard/Sources/App
      - path: WhisperBoard/Sources/Views
      - path: WhisperBoard/Sources/Shared
      - path: WhisperBoard/Sources/Ruminate
      - path: WhisperBoard/Sources/CallProbe
      - path: WhisperBoard/Sources/WhisperKit
      - path: WhisperBoard/Resources
        excludes:
          - "Info.plist"
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.captainsos.whisperboard
      CODE_SIGN_ENTITLEMENTS: WhisperBoard/Resources/WhisperBoard.entitlements
      INFOPLIST_FILE: WhisperBoard/Resources/Info.plist
    dependencies:
      - target: WhisperBoardKeyboard
      - target: WhisperBoardIntents
      - target: WhisperBoardCallActivity
      - package: WhisperKit
    scheme:
      testTargets:
        - WhisperBoardTests

  # ─── Keyboard Extension ──────────────────────────────
  # IMPORTANT: No WhisperKit dependency – keeps memory under ~25 MB.
  # The extension captures audio and communicates with the main app
  # via App Group + Darwin notifications.
  WhisperBoardKeyboard:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: WhisperBoard/Sources/KeyboardExtension
        excludes:
          - "*.bak"
          - "WhisperKitIntegration.swift"
      - path: WhisperBoard/Sources/Shared
      - path: WhisperBoard/Sources/WhisperKit/AudioProcessor.swift
      - path: WhisperBoard/KeyboardExtension/Resources
        excludes:
          - "KeyboardInfo.plist"
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.captainsos.whisperboard.keyboard
      CODE_SIGN_ENTITLEMENTS: WhisperBoard/KeyboardExtension/Resources/KeyboardExtension.entitlements
      INFOPLIST_FILE: WhisperBoard/KeyboardExtension/Resources/KeyboardInfo.plist
    # No package dependencies – pure UIKit + AVFoundation + system frameworks only

  # ─── Siri (voice proxy Phase 0) ──────────────────────
  # Passes INStartCallIntent to the app. INAlternativeAppNames also needs this
  # extension: Siri honours the "Ruminate" alias only with one present.
  WhisperBoardIntents:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: WhisperBoard/Sources/IntentsExtension
      - path: WhisperBoard/IntentsExtension/Resources
        excludes:
          - "IntentsInfo.plist"
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.captainsos.whisperboard.intents
      INFOPLIST_FILE: WhisperBoard/IntentsExtension/Resources/IntentsInfo.plist

  # ─── Test call Live Activity (voice proxy Phase 0) ───
  WhisperBoardCallActivity:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: WhisperBoard/Sources/CallActivity
      - path: WhisperBoard/Sources/CallProbe/ProbeActivityAttributes.swift
      - path: WhisperBoard/CallActivity/Resources
        excludes:
          - "CallActivityInfo.plist"
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.captainsos.whisperboard.callactivity
      INFOPLIST_FILE: WhisperBoard/CallActivity/Resources/CallActivityInfo.plist

  # ─── Tests ────────────────────────────────────────────
  WhisperBoardTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: WhisperBoardTests
    dependencies:
      - target: WhisperBoard
